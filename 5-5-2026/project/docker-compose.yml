services:
  api:
    build: .
    container_name: cairo-api
    command: uvicorn src.backend.api:app --host 0.0.0.0 --port 8000
    environment:
      - PYTHONPATH=/app:/app/src
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; urllib.request.urlopen('http://localhost:8000/').read()"]
      interval: 15s
      timeout: 5s
      retries: 5

  dashboard:
    build: .
    container_name: cairo-dashboard
    command: streamlit run app.py --server.address=0.0.0.0 --server.port=8501 --server.headless=true
    ports:
      - "8501:8501"
    depends_on:
      - api
    environment:
      - API_BASE=http://api:8000
      - PYTHONPATH=/app:/app/src